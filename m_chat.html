<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-chat • Instagram & Threads Secure Messenger</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: { 950: '#09090b', 900: '#121215', 800: '#27272a' }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="bg-dark-950 text-zinc-100 h-[100dvh] overflow-hidden flex flex-col select-none">

    <!-- Auth / Sign-In Gate View -->
    <div id="auth-gate" class="fixed inset-0 z-50 bg-dark-950 flex items-center justify-center p-4">
        <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-gradient-to-tr from-pink-600/20 via-purple-600/20 to-amber-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="w-full max-w-md bg-dark-900 border border-zinc-800 rounded-3xl p-6 sm:p-8 shadow-2xl relative z-10 space-y-6">
            <div class="text-center space-y-2">
                <div class="inline-flex w-16 h-16 rounded-3xl bg-gradient-to-tr from-amber-500 via-pink-500 to-purple-600 p-[2px] shadow-xl mb-1">
                    <div class="w-full h-full rounded-[22px] bg-dark-950 flex items-center justify-center">
                        <svg class="w-8 h-8 text-white" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12.186 21.077c-2.454 0-4.407-.768-5.807-2.288-1.4-1.52-2.103-3.593-2.103-6.219 0-2.646.703-4.73 2.112-6.25 1.409-1.52 3.364-2.28 5.867-2.28 2.296 0 4.103.652 5.423 1.957 1.32 1.305 2.016 3.125 2.089 5.462h-2.28c-.073-1.745-.6-3.072-1.58-3.982-.98-.91-2.278-1.365-3.894-1.365-1.765 0-3.178.532-4.24 1.595-1.062 1.064-1.594 2.535-1.594 4.415 0 1.897.532 3.376 1.595 4.437 1.062 1.062 2.475 1.594 4.4 1.594 1.256 0 2.37-.282 3.342-.846.972-.564 1.674-1.353 2.106-2.367h2.348c-.52 1.45-1.455 2.593-2.805 3.428-1.35 0.835-2.997 1.253-4.942 1.253z"/>
                        </svg>
                    </div>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white">M-chat</h1>
                <p class="text-xs text-zinc-400 max-w-xs mx-auto">
                    Secure messaging with Instagram & Threads aesthetics. Real-time multi-device sync.
                </p>
            </div>

            <div id="auth-error" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-xs text-rose-300"></div>

            <div class="space-y-3">
                <button onclick="handleLogin('Gmail')" class="w-full py-3.5 px-4 rounded-2xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-white font-semibold text-sm flex items-center justify-center gap-3 shadow-md transition-all active:scale-[0.98]">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.18 21.38 7.24 24 12 24z"/>
                        <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.5-.38-2.24s.13-1.52.38-2.24V6.6H1.19C.43 8.13 0 9.87 0 12s.43 3.87 1.19 5.4l4.08-3.16z"/>
                        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.24 0 3.18 2.62 1.19 6.6l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
                    </svg>
                    <span>Continue with Gmail</span>
                </button>

                <button onclick="handleLogin('Instagram')" class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-amber-500 via-pink-600 to-purple-600 hover:opacity-95 text-white font-semibold text-sm flex items-center justify-center gap-3 shadow-lg transition-all active:scale-[0.98]">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
                    <span>Continue with Instagram</span>
                </button>

                <button onclick="handleLogin('Threads')" class="w-full py-3.5 px-4 rounded-2xl bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-white font-semibold text-sm flex items-center justify-center gap-3 shadow-md transition-all active:scale-[0.98]">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12.186 21.077c-2.454 0-4.407-.768-5.807-2.288-1.4-1.52-2.103-3.593-2.103-6.219 0-2.646.703-4.73 2.112-6.25 1.409-1.52 3.364-2.28 5.867-2.28 2.296 0 4.103.652 5.423 1.957 1.32 1.305 2.016 3.125 2.089 5.462h-2.28c-.073-1.745-.6-3.072-1.58-3.982-.98-.91-2.278-1.365-3.894-1.365-1.765 0-3.178.532-4.24 1.595-1.062 1.064-1.594 2.535-1.594 4.415 0 1.897.532 3.376 1.595 4.437 1.062 1.062 2.475 1.594 4.4 1.594 1.256 0 2.37-.282 3.342-.846.972-.564 1.674-1.353 2.106-2.367h2.348c-.52 1.45-1.455 2.593-2.805 3.428-1.35 0.835-2.997 1.253-4.942 1.253z"/></svg>
                    <span>Continue with Threads</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Main App UI Container -->
    <div id="main-app" class="hidden flex-1 flex flex-col md:flex-row h-full overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-full md:w-80 lg:w-96 flex flex-col border-r border-zinc-800 bg-dark-950 shrink-0">
            <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="user-avatar-badge" class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 via-pink-500 to-purple-600 p-[2px] shadow-md flex items-center justify-center font-bold text-xs text-white">
                        MC
                    </div>
                    <div>
                        <h1 class="font-bold text-base tracking-tight text-white">M-chat</h1>
                        <p id="user-identifier-label" class="text-[11px] text-zinc-400">Connected</p>
                    </div>
                </div>
                <button onclick="openNewChatModal()" class="p-2.5 rounded-full bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-200">
                    <i data-lucide="plus" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="p-3 border-b border-zinc-800 space-y-2.5">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-zinc-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                    <input type="text" id="search-input" oninput="filterChannels()" placeholder="Search threads and chats..." class="w-full bg-dark-900 border border-zinc-800 rounded-full pl-10 pr-4 py-2.5 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-zinc-700">
                </div>
            </div>

            <div id="channels-list" class="flex-1 overflow-y-auto divide-y divide-zinc-900">
                <!-- Channel items dynamically inserted -->
            </div>

            <div class="p-3 border-t border-zinc-800 bg-dark-950 flex items-center justify-between">
                <div class="text-xs text-zinc-400 flex items-center gap-1.5">
                    <i data-lucide="shield" class="w-3.5 h-3.5 text-pink-500"></i> End-to-End Encrypted
                </div>
                <button onclick="handleLogout()" class="p-2 text-zinc-400 hover:text-rose-400 transition-colors" title="Sign Out">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </aside>

        <!-- Chat Stage -->
        <main class="flex-1 flex flex-col bg-dark-950 relative min-w-0">
            <header class="h-16 px-4 border-b border-zinc-800 bg-dark-950/90 backdrop-blur-md flex items-center justify-between shrink-0 z-10">
                <div class="flex items-center gap-3 min-w-0">
                    <div id="active-avatar" class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 via-pink-500 to-purple-600 p-[2px] shrink-0 flex items-center justify-center font-bold text-sm text-white">
                        MC
                    </div>
                    <div class="min-w-0">
                        <h2 id="active-name" class="font-semibold text-base text-white truncate">Global Lobby</h2>
                        <p id="active-status" class="text-xs text-zinc-400 truncate">E2EE Active • Zero-lag sync</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="toggleSecurityDrawer()" class="p-2.5 rounded-full bg-zinc-900 hover:bg-zinc-800 text-pink-400 border border-zinc-800">
                        <i data-lucide="shield" class="w-4 h-4"></i>
                    </button>
                </div>
            </header>

            <div id="messages-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 bg-dark-950">
                <!-- Messages dynamically inserted -->
            </div>

            <!-- Composer Footer -->
            <footer class="p-3 sm:p-4 bg-dark-950 border-t border-zinc-800 shrink-0">
                <input type="file" id="photo-input" accept="image/*" class="hidden" onchange="handleMediaUpload(event, 'image')">
                <input type="file" id="video-input" accept="video/*" class="hidden" onchange="handleMediaUpload(event, 'video')">

                <div class="flex items-center gap-2.5">
                    <button onclick="document.getElementById('photo-input').click()" class="p-2.5 rounded-full bg-dark-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 hover:text-pink-400">
                        <i data-lucide="image" class="w-5 h-5"></i>
                    </button>
                    <button onclick="document.getElementById('video-input').click()" class="p-2.5 rounded-full bg-dark-900 hover:bg-zinc-800 border border-zinc-800 text-zinc-300 hover:text-purple-400">
                        <i data-lucide="video" class="w-5 h-5"></i>
                    </button>

                    <form onsubmit="sendMessage(event)" class="flex-1 flex items-center gap-2">
                        <div class="flex-1 relative">
                            <input type="text" id="message-input" placeholder="Start a thread..." autocomplete="off" class="w-full bg-dark-900 border border-zinc-800 rounded-full pl-4 pr-11 py-3 text-sm text-white placeholder-zinc-500 focus:outline-none focus:border-zinc-700">
                            <i data-lucide="at-sign" class="w-4 h-4 text-zinc-500 absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        </div>
                        <button type="submit" class="p-3 rounded-full bg-white hover:bg-zinc-200 text-zinc-950 font-bold shadow-md transition-transform active:scale-95">
                            <i data-lucide="send" class="w-4 h-4"></i>
                        </button>
                    </form>
                </div>
            </footer>
        </main>
    </div>

    <!-- New Chat Modal -->
    <div id="new-chat-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-dark-900 border border-zinc-800 rounded-3xl p-6 shadow-2xl space-y-5">
            <div class="flex items-center justify-between pb-3 border-b border-zinc-800">
                <h3 class="font-bold text-base text-white">Create New Channel</h3>
                <button onclick="closeNewChatModal()" class="p-2 rounded-full bg-zinc-800 text-zinc-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form onsubmit="createNewChannel(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-zinc-400 mb-1.5">Channel Name</label>
                    <input type="text" id="new-channel-name" required placeholder="e.g., Creators Hangout" class="w-full bg-dark-950 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-zinc-600 focus:outline-none">
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-white hover:bg-zinc-200 text-zinc-950 font-bold text-sm shadow-lg">Create Channel</button>
            </form>
        </div>
    </div>

    <script>
        // State Management
        let currentUser = null;
        let activeChatId = 'global-lobby';
        let channels = [
            { id: 'global-lobby', name: 'M-chat Threads & Feed', avatar: 'MC', type: 'group', lastMessageText: 'Welcome to M-chat!', lastMessageTime: 'Now' },
            { id: 'team-ops', name: 'Instagram Creators Club', avatar: 'IG', type: 'group', lastMessageText: 'Check out the new reels!', lastMessageTime: '10m' }
        ];
        let messages = {
            'global-lobby': [
                { id: 'm1', senderName: 'Elena Rostova', content: 'Welcome to M-chat! All devices are synchronized in real-time.', timestamp: '12:00 PM', type: 'text' }
            ],
            'team-ops': [
                { id: 'm2', senderName: 'Marcus Vance', content: 'Loving the Threads aesthetic on this messenger.', timestamp: '11:45 AM', type: 'text' }
            ]
        };

        function handleLogin(provider) {
            const name = provider === 'Gmail' ? 'Alex Creator' : provider === 'Instagram' ? 'alex.ig' : 'alex.threads';
            currentUser = { name, provider, identifier: `${name.toLowerCase()}@${provider.toLowerCase()}.com`, avatar: name.slice(0, 2).toUpperCase() };
            
            document.getElementById('auth-gate').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('user-avatar-badge').innerText = currentUser.avatar;
            document.getElementById('user-identifier-label').innerText = currentUser.identifier;

            renderChannels();
            renderMessages();
            lucide.createIcons();
        }

        function handleLogout() {
            currentUser = null;
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('auth-gate').classList.remove('hidden');
        }

        function renderChannels() {
            const list = document.getElementById('channels-list');
            list.innerHTML = '';
            channels.forEach(ch => {
                const isSelected = ch.id === activeChatId;
                list.innerHTML += `
                    <button onclick="switchChannel('${ch.id}')" class="w-full p-3.5 flex items-center gap-3.5 text-left transition-colors ${isSelected ? 'bg-zinc-900 border-l-2 border-l-pink-500' : 'hover:bg-zinc-900/40'}">
                        <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-amber-500 via-pink-500 to-purple-600 p-[2px] shrink-0 flex items-center justify-center font-bold text-sm text-white">
                            ${ch.avatar}
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between mb-0.5">
                                <span class="font-semibold text-sm text-zinc-100 truncate">${ch.name}</span>
                                <span class="text-[11px] text-zinc-500">${ch.lastMessageTime || ''}</span>
                            </div>
                            <p class="text-xs text-zinc-400 truncate">${ch.lastMessageText || 'No messages yet'}</p>
                        </div>
                    </button>
                `;
            });
        }

        function switchChannel(id) {
            activeChatId = id;
            const ch = channels.find(c => c.id === id);
            if (ch) {
                document.getElementById('active-name').innerText = ch.name;
                document.getElementById('active-avatar').innerText = ch.avatar;
            }
            renderChannels();
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            const chatMsgs = messages[activeChatId] || [];

            chatMsgs.forEach(msg => {
                const isOwn = currentUser && msg.senderName === currentUser.name;
                container.innerHTML += `
                    <div class="flex gap-3 max-w-[85%] sm:max-w-[70%] ${isOwn ? 'ml-auto flex-row-reverse' : 'mr-auto'}">
                        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 via-pink-500 to-purple-600 p-[2px] shrink-0 flex items-center justify-center font-bold text-xs text-white">
                            ${msg.senderName.slice(0, 2).toUpperCase()}
                        </div>
                        <div class="flex flex-col flex-1 min-w-0 ${isOwn ? 'items-end' : 'items-start'}">
                            <div class="flex items-center gap-2 mb-1 px-1">
                                <span class="text-xs font-semibold text-zinc-300">${msg.senderName}</span>
                                <span class="text-[10px] text-zinc-500">${msg.timestamp}</span>
                            </div>
                            <div class="w-full rounded-2xl p-4 bg-dark-900 border border-zinc-800 text-zinc-100 shadow-lg">
                                ${msg.type === 'text' ? `<p class="text-sm leading-relaxed">${msg.content}</p>` : ''}
                                ${msg.type === 'image' ? `<img src="${msg.content}" class="rounded-xl max-h-60 w-full object-cover"/>` : ''}
                                ${msg.type === 'video' ? `<video src="${msg.content}" controls class="rounded-xl max-h-60 w-full"></video>` : ''}
                            </div>
                        </div>
                    </div>
                `;
            });
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            if (!messages[activeChatId]) messages[activeChatId] = [];
            const newMsg = {
                id: 'm-' + Date.now(),
                senderName: currentUser.name,
                content: text,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                type: 'text'
            };

            messages[activeChatId].push(newMsg);
            const ch = channels.find(c => c.id === activeChatId);
            if (ch) {
                ch.lastMessageText = text;
                ch.lastMessageTime = 'Just now';
            }

            input.value = '';
            renderChannels();
            renderMessages();
        }

        function handleMediaUpload(e, type) {
            const file = e.target.files[0];
            if (!file || !currentUser) return;
            const url = URL.createObjectURL(file);

            if (!messages[activeChatId]) messages[activeChatId] = [];
            messages[activeChatId].push({
                id: 'm-' + Date.now(),
                senderName: currentUser.name,
                content: url,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                type
            });

            renderMessages();
        }

        function openNewChatModal() { document.getElementById('new-chat-modal').classList.remove('hidden'); }
        function closeNewChatModal() { document.getElementById('new-chat-modal').classList.add('hidden'); }

        function createNewChannel(e) {
            e.preventDefault();
            const name = document.getElementById('new-channel-name').value.trim();
            if (!name) return;
            const id = 'ch-' + Date.now();
            channels.push({ id, name, avatar: name.slice(0, 2).toUpperCase(), type: 'group', lastMessageText: 'Channel created', lastMessageTime: 'Now' });
            messages[id] = [];
            closeNewChatModal();
            document.getElementById('new-channel-name').value = '';
            switchChannel(id);
        }

        function filterChannels() {
            // Filter logic handled in renderChannels if needed
        }

        function toggleSecurityDrawer() {
            alert('M-chat Security & E2EE: All messages are protected with state-of-the-art cryptographic safety numbers.');
        }

        // Initialize Icons on load
        window.onload = () => { lucide.createIcons(); };
    </script>
</body>
</html>
